<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Tienda Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER ADMIN */
        .admin-header {
            background: #1a1a2e;
            color: white;
            padding: 25px 30px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            font-size: 1.8em;
            font-weight: 800;
        }
        .admin-header h1 span {
            color: #ffd700;
        }
        .admin-header .subtitle {
            opacity: 0.7;
            font-size: 0.95em;
        }
        .admin-header .badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.85em;
        }

        /* CUERPO */
        .admin-body {
            background: white;
            padding: 30px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }

        /* LAYOUT FORMULARIO + PREVISUALIZACIÓN */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            align-items: start;
        }

        /* FORMULARIO */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.85em;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 14px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: 0.95em;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .btn {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #2d2d4a;
            transform: scale(1.01);
        }

        /* ESTILOS DE PREVISUALIZACIÓN */
        .preview-section {
            background: #f8f9fc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e8ecf1;
        }
        .preview-section h3 {
            font-size: 0.85em;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .preview-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .preview-card .preview-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .preview-card .preview-image-placeholder {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: #ccc;
        }
        .preview-card .preview-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .preview-card .preview-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .preview-card .preview-model {
            background: #1a1a2e;
            color: white;
            font-size: 0.6em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .preview-card .preview-category {
            background: #e8e8e8;
            color: #333;
            font-size: 0.6em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .preview-card .preview-new-badge {
            background: #e74c3c;
            color: white;
            font-size: 0.6em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 20px;
            display: none;
        }
        .preview-card .preview-name {
            font-size: 1em;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .preview-card .preview-description {
            color: #666;
            font-size: 0.8em;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .preview-card .preview-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .preview-card .preview-price {
            font-size: 1.2em;
            font-weight: 800;
            color: #1a1a2e;
        }
        .preview-card .preview-btn {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.75em;
            text-transform: uppercase;
        }

        /* MENSAJES */
        .message {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.loading {
            display: block;
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        @media (max-width: 850px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-grid .full-width {
                grid-column: 1;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="admin-header">
            <div>
                <h1>⚡ TIENDA<span>ADMIN</span></h1>
                <div class="subtitle">Panel de Administración de Productos</div>
            </div>
            <div class="badge">🔒 Acceso restringido</div>
        </div>

        <div class="admin-body">
            <!-- EDITOR Y PREVISUALIZACIÓN -->
            <div class="editor-container">
                <!-- FORMULARIO -->
                <form id="productForm" class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombre">Nombre del producto *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Perfume Floral 100ml">
                    </div>

                    <div class="form-group full-width">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" placeholder="Describe la fragancia o producto..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="modeloSelect">Modelo / Marca *</label>
                        <select id="modeloSelect" required onchange="cambiarModelo()">
                            <option value="">Cargando modelos...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria">
                            <option value="Perfumes">Perfumes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nuevo">¿Es Nuevo? *</label>
                        <select id="nuevo" name="nuevo">
                            <option value="No">No</option>
                            <option value="Sí">Sí</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio (€) *</label>
                        <input type="number" id="precio" name="precio" required step="0.01" placeholder="19.99">
                    </div>

                    <div class="form-group full-width">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" value="10" min="0">
                    </div>

                    <div class="form-group full-width">
                        <label for="imagenURL">URL de la imagen</label>
                        <input type="url" id="imagenURL" name="imagenURL" placeholder="https://drive.google.com/file/d/...">
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn">➕ Agregar Producto</button>
                    </div>
                </form>

                <!-- PREVISUALIZACIÓN -->
                <div class="preview-section">
                    <h3>Vista previa en Tienda</h3>
                    <div class="preview-card">
                        <div id="previewImageContainer">
                            <div class="preview-image-placeholder">📷</div>
                        </div>
                        <div class="preview-body">
                            <div class="preview-tags">
                                <span class="preview-model" id="previewModel">MODELO</span>
                                <span class="preview-category" id="previewCategory">Perfumes</span>
                                <span class="preview-new-badge" id="previewNewBadge">NUEVO</span>
                            </div>
                            <div class="preview-name" id="previewName">Nombre del producto</div>
                            <div class="preview-description" id="previewDescription">Descripción corta del producto.</div>
                            <div class="preview-footer">
                                <div class="preview-price" id="previewPrice">€0.00</div>
                                <button type="button" class="preview-btn" id="previewBtn">🛒 Agregar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN API
        // ============================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwWbH-lfapTSCSUVqKhA8QII3FfWYkBhAEM9_E7op4EIkBuFIVxxeY37kNfUW0-x_4B/exec";

        let modeloActual = "";

        // ============================================
        // CARGAR MODELOS (HOJAS)
        // ============================================
        async function cargarModelos() {
            try {
                const res = await fetch(`${API_URL}?action=obtenerModelos`);
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('modeloSelect');
                    select.innerHTML = '';
                    data.modelos.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m;
                        select.appendChild(opt);
                    });
                    if (data.modelos.length) {
                        select.value = data.modelos[0];
                        modeloActual = data.modelos[0];
                        actualizarPrevisualizacion();
                    }
                } else {
                    showMessage('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('Error de conexión: ' + e.message, 'error');
            }
        }

        // ============================================
        // CAMBIAR MODELO
        // ============================================
        function cambiarModelo() {
            const select = document.getElementById('modeloSelect');
            modeloActual = select.value;
            actualizarPrevisualizacion();
        }

        // ============================================
        // PREVISUALIZACIÓN EN TIEMPO REAL
        // ============================================
        function actualizarPrevisualizacion() {
            const nombre = document.getElementById('nombre').value || 'Nombre del producto';
            const descripcion = document.getElementById('descripcion').value || 'Descripción corta del producto.';
            const precioVal = document.getElementById('precio').value;
            const precio = precioVal ? '€' + parseFloat(precioVal).toFixed(2) : '€0.00';
            const stock = parseInt(document.getElementById('stock').value) || 0;
            const categoria = document.getElementById('categoria').value || 'Perfumes';
            const esNuevo = document.getElementById('nuevo').value;
            const urlRaw = document.getElementById('imagenURL').value;

            document.getElementById('previewName').textContent = nombre;
            document.getElementById('previewDescription').textContent = descripcion;
            document.getElementById('previewPrice').textContent = precio;
            document.getElementById('previewCategory').textContent = categoria;
            document.getElementById('previewModel').textContent = modeloActual || 'MODELO';

            const newBadge = document.getElementById('previewNewBadge');
            if (esNuevo === 'Sí') {
                newBadge.style.display = 'inline-block';
            } else {
                newBadge.style.display = 'none';
            }

            const btn = document.getElementById('previewBtn');
            if (stock <= 0) {
                btn.textContent = 'Agotado';
                btn.disabled = true;
                btn.style.opacity = '0.6';
            } else {
                btn.textContent = '🛒 Agregar';
                btn.disabled = false;
                btn.style.opacity = '1';
            }

            const imgContainer = document.getElementById('previewImageContainer');
            if (urlRaw) {
                let imgSrc = urlRaw;
                const match = urlRaw.match(/\/d\/([a-zA-Z0-9_-]+)/) || urlRaw.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    imgSrc = `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                imgContainer.innerHTML = `<img class="preview-image" src="${imgSrc}" alt="${nombre}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'preview-image-placeholder\\'>📷</div>';">`;
            } else {
                imgContainer.innerHTML = '<div class="preview-image-placeholder">📷</div>';
            }
        }

        // Vincular eventos del formulario a la previsualización
        ['nombre', 'descripcion', 'precio', 'stock', 'imagenURL', 'categoria', 'nuevo', 'modeloSelect'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', actualizarPrevisualizacion);
                el.addEventListener('change', actualizarPrevisualizacion);
            }
        });

        // ============================================
        // MOSTRAR MENSAJE DE ESTADO
        // ============================================
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            if (type !== 'loading') {
                setTimeout(() => { msg.className = 'message'; }, 5000);
            }
        }

        // ============================================
        // AGREGAR PRODUCTO
        // ============================================
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const modeloSeleccionado = document.getElementById('modeloSelect').value;
            if (!modeloSeleccionado) {
                showMessage('❌ Selecciona un modelo primero', 'error');
                return;
            }

            const nombre = document.getElementById('nombre').value;
            const descripcion = document.getElementById('descripcion').value || '';
            const precio = document.getElementById('precio').value;
            const stock = document.getElementById('stock').value || 0;
            const imagenURL = document.getElementById('imagenURL').value || '';
            const categoria = document.getElementById('categoria').value || 'Perfumes';
            const nuevo = document.getElementById('nuevo').value || 'No';

            const params = new URLSearchParams();
            params.append('action', 'agregar');
            params.append('modelo', modeloSeleccionado);
            params.append('nombre', nombre);
            params.append('descripcion', descripcion);
            params.append('precio', precio);
            params.append('imagenURL', imagenURL);
            params.append('stock', stock);
            params.append('categoria', categoria);
            params.append('nuevo', nuevo);

            showMessage('Agregando producto...', 'loading');
            try {
                const res = await fetch(`${API_URL}?${params.toString()}`);
                const data = await res.json();
                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    this.reset();
                    actualizarPrevisualizacion();
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('❌ Error de conexión', 'error');
            }
        });

        // ============================================
        // INICIO AUTOMÁTICO
        // ============================================
        cargarModelos();
    </script>
</body>
</html>
