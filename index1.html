<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Tienda Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* HEADER ADMIN */
        .admin-header {
            background: #1a1a2e;
            color: white;
            padding: 25px 30px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            font-size: 1.8em;
            font-weight: 800;
        }
        .admin-header h1 span {
            color: #ffd700;
        }
        .admin-header .subtitle {
            opacity: 0.7;
            font-size: 0.95em;
        }
        .admin-header .badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.85em;
        }

        /* CUERPO */
        .admin-body {
            background: white;
            padding: 30px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }

        /* SELECTOR MODELO */
        .model-selector {
            background: #f8f9fc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e8ecf1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }
        .model-selector label {
            font-weight: 700;
            color: #1a1a2e;
        }
        .model-selector select {
            padding: 10px 18px;
            border: 2px solid #dce0e6;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            min-width: 180px;
            font-weight: 600;
        }
        .model-selector select:focus {
            outline: none;
            border-color: #1a1a2e;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .stat-box {
            background: white;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #e8ecf1;
            text-align: center;
        }
        .stat-box .number {
            font-size: 1.6em;
            font-weight: 800;
            color: #1a1a2e;
        }
        .stat-box .label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* FORMULARIO */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.85em;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 14px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: 0.95em;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .btn {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #2d2d4a;
            transform: scale(1.01);
        }

        /* MENSAJES */
        .message {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.loading {
            display: block;
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        /* LISTA PRODUCTOS */
        .product-list {
            margin-top: 40px;
            border-top: 2px solid #f0f2f5;
            padding-top: 25px;
        }
        .product-list h2 {
            font-size: 1.2em;
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #f8f9fc;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .product-item:hover {
            background: #f0f2f5;
            border-color: #e0e4ea;
        }
        .product-item .info {
            flex: 1;
        }
        .product-item .name {
            font-weight: 700;
            color: #1a1a2e;
        }
        .product-item .meta {
            font-size: 0.8em;
            color: #888;
            margin-top: 2px;
        }
        .product-item .price {
            font-weight: 700;
            color: #1a1a2e;
            margin-right: 20px;
        }
        .product-item .model-tag {
            background: #1a1a2e;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65em;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 8px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8em;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background: #c0392b;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 30px;
        }
        .loading-spinner.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #eee;
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-grid .full-width {
                grid-column: 1;
            }
            .model-selector {
                flex-direction: column;
                align-items: stretch;
            }
            .stats {
                margin-left: 0;
                justify-content: center;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            .product-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .product-item .price {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="admin-header">
            <div>
                <h1>⚡ TIENDA<span>ADMIN</span></h1>
                <div class="subtitle">Panel de Administración de Productos</div>
            </div>
            <div class="badge">🔒 Acceso restringido</div>
        </div>

        <div class="admin-body">
            <!-- SELECTOR MODELO -->
            <div class="model-selector">
                <label for="modeloSelect">📌 Modelo:</label>
                <select id="modeloSelect" onchange="cambiarModelo()">
                    <option value="">Cargando...</option>
                </select>
                <div class="stats">
                    <div class="stat-box">
                        <div class="number" id="totalProductos">0</div>
                        <div class="label">Productos</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="modeloActual">-</div>
                        <div class="label">Activo</div>
                    </div>
                </div>
            </div>

            <!-- FORMULARIO -->
            <form id="productForm" class="form-grid">
                <div class="form-group full-width">
                    <label for="nombre">Nombre del producto *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Perfume Floral 100ml">
                </div>
                <div class="form-group full-width">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Describe la fragancia o producto..."></textarea>
                </div>
                <div class="form-group">
                    <label for="precio">Precio (€) *</label>
                    <input type="number" id="precio" name="precio" required step="0.01" placeholder="19.99">
                </div>
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" name="stock" value="10" min="0">
                </div>
                <div class="form-group full-width">
                    <label for="imagenURL">URL de la imagen</label>
                    <input type="url" id="imagenURL" name="imagenURL" placeholder="https://drive.google.com/file/d/...">
                </div>
                <div class="form-group full-width">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                        <option value="General">General</option>
                        <option value="Perfumes">Perfumes</option>
                        <option value="Fragancias">Fragancias</option>
                        <option value="Accesorios">Accesorios</option>
                        <option value="Desechable">Desechable</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn">➕ Agregar Producto</button>
                </div>
            </form>

            <div id="message" class="message"></div>

            <!-- LISTA -->
            <div class="product-list">
                <h2>📦 Productos Registrados</h2>
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p style="color:#888;">Cargando productos...</p>
                </div>
                <div id="productList"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN API
        // ============================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwhVw_mk6dPeYo8y2-x0hPspuzxRqx4LKYLXSGXMhNmkBdtI7yka0v2KRdGkPniBaLc/exec";

        let modeloActual = "";

        // ============================================
        // CARGAR MODELOS (HOJAS)
        // ============================================
        async function cargarModelos() {
            try {
                const res = await fetch(`${API_URL}?action=obtenerModelos`);
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('modeloSelect');
                    select.innerHTML = '';
                    data.modelos.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m;
                        select.appendChild(opt);
                    });
                    if (data.modelos.length) {
                        select.value = data.modelos[0];
                        modeloActual = data.modelos[0];
                        cargarProductos(modeloActual);
                    }
                } else {
                    showMessage('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('Error de conexión: ' + e.message, 'error');
            }
        }

        // ============================================
        // CAMBIAR MODELO
        // ============================================
        function cambiarModelo() {
            const select = document.getElementById('modeloSelect');
            modeloActual = select.value;
            if (modeloActual) cargarProductos(modeloActual);
        }

        // ============================================
        // CARGAR PRODUCTOS
        // ============================================
        async function cargarProductos(modelo) {
            const spinner = document.getElementById('loadingSpinner');
            const list = document.getElementById('productList');
            spinner.classList.add('active');
            document.getElementById('modeloActual').textContent = modelo;

            try {
                const res = await fetch(`${API_URL}?action=obtenerPorModelo&modelo=${encodeURIComponent(modelo)}`);
                const data = await res.json();
                if (data.success) {
                    const productos = data.productos;
                    document.getElementById('totalProductos').textContent = productos.length;

                    if (!productos.length) {
                        list.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">No hay productos en este modelo.</p>';
                    } else {
                        list.innerHTML = productos.map(p => `
                            <div class="product-item">
                                <div class="info">
                                    <div class="name">${p.Nombre || 'Sin nombre'} <span class="model-tag">${modelo}</span></div>
                                    <div class="meta">${p.Categoría || p.Categoria || 'General'} · Stock: ${p.Stock || 0}</div>
                                </div>
                                <div class="price">${p.Precio ? '€' + parseFloat(p.Precio).toFixed(2) : 'N/D'}</div>
                                <button class="delete-btn" onclick="eliminarProducto('${modelo}', ${p.ID})">Eliminar</button>
                            </div>
                        `).join('');
                    }
                } else {
                    showMessage('Error: ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('Error de conexión: ' + e.message, 'error');
            } finally {
                spinner.classList.remove('active');
            }
        }

        // ============================================
        // MOSTRAR MENSAJE DE ESTADO
        // ============================================
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            if (type !== 'loading') {
                setTimeout(() => { msg.className = 'message'; }, 5000);
            }
        }

        // ============================================
        // AGREGAR PRODUCTO
        // ============================================
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!modeloActual) {
                showMessage('❌ Selecciona un modelo primero', 'error');
                return;
            }

            // Lectura directa de los campos del formulario por su ID
            const nombre = document.getElementById('nombre').value;
            const descripcion = document.getElementById('descripcion').value || '';
            const precio = document.getElementById('precio').value;
            const stock = document.getElementById('stock').value || 0;
            const imagenURL = document.getElementById('imagenURL').value || '';
            const categoria = document.getElementById('categoria').value || 'General';

            const params = new URLSearchParams();
            params.append('action', 'agregar');
            params.append('modelo', modeloActual);
            params.append('nombre', nombre);
            params.append('descripcion', descripcion);
            params.append('precio', precio);
            params.append('imagenURL', imagenURL);
            params.append('stock', stock);
            params.append('categoria', categoria);

            showMessage('Agregando producto...', 'loading');
            try {
                const res = await fetch(`${API_URL}?${params.toString()}`);
                const data = await res.json();
                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    this.reset();
                    cargarProductos(modeloActual);
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('❌ Error de conexión', 'error');
            }
        });

        // ============================================
        // ELIMINAR PRODUCTO
        // ============================================
        async function eliminarProducto(modelo, id) {
            if (!confirm(`¿Eliminar producto #${id} de ${modelo}?`)) return;
            showMessage('Eliminando...', 'loading');
            try {
                const res = await fetch(`${API_URL}?action=eliminar&modelo=${encodeURIComponent(modelo)}&id=${id}`);
                const data = await res.json();
                if (data.success) {
                    showMessage('✅ Producto eliminado', 'success');
                    cargarProductos(modelo);
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('❌ Error de conexión', 'error');
            }
        }

        // ============================================
        // INICIO AUTOMÁTICO
        // ============================================
        cargarModelos();
    </script>
</body>
</html>
